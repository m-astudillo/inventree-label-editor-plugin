#This file is used to package the InvertreeLabelEditor plugin.
#
#- It was generated by the InvenTree Plugin Creator tool - version 1.20.0
#- Ref: https://github.com/inventree/plugin_creator

[build-system]
requires = ["setuptools", "twine", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inventree-invertree-label-editor"
description = "A Powerfull label editor"
dynamic = ["version"]
authors = [
    { name = "manast",email = "manuel.astudillo.pinto@gmail.com" },
]
readme = "README.md"
license = "MIT"
keywords = ["inventree", "plugin"]
requires-python = ">=3.9"
dependencies = [
    # Enter your plugin library dependencies here
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Framework :: InvenTree",
]

[project.entry-points."inventree_plugins"]
InvertreeLabelEditor = "invertree_label_editor.core:InvertreeLabelEditor"

[tool.setuptools.packages.find]
where = [""]

[tool.setuptools.dynamic]
version = {attr = "invertree_label_editor.PLUGIN_VERSION"} 

[tool.ruff]
exclude = [
    ".git",
    "__pycache__",
    "test.py",
    "tests",
    "venv",
    "env",
    ".venv",
    ".env",
]

src=["invertree_label_editor"]
